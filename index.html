<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT — агенты для экспертов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0e12;
      --bg-mid: #121820;
      --surface: rgba(26, 34, 46, 0.72);
      --surface-border: rgba(255, 255, 255, 0.09);
      --text: #eef3f8;
      --accent: #5eb0ff;
      --accent-dim: rgba(94, 176, 255, 0.12);
      --accent-glow: rgba(94, 176, 255, 0.35);
      --radius-xl: 1.5rem;
      --radius-md: 0.75rem;
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.2),
        0 24px 48px -16px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      font-optical-sizing: auto;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      line-height: 1.55;
      position: relative;
      overflow-x: hidden;
      background: var(--bg-deep);
    }

    /* Мягкий анимированный фон */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse 120% 80% at 50% -20%, rgba(94, 176, 255, 0.18) 0%, transparent 50%),
        radial-gradient(ellipse 80% 60% at 100% 60%, rgba(130, 110, 255, 0.1) 0%, transparent 45%),
        radial-gradient(ellipse 70% 50% at 0% 80%, rgba(60, 200, 180, 0.06) 0%, transparent 40%),
        linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-mid) 50%, #0d1116 100%);
      animation: bgShift 18s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% {
        filter: hue-rotate(0deg) brightness(1);
        transform: scale(1);
      }
      100% {
        filter: hue-rotate(12deg) brightness(1.05);
        transform: scale(1.02);
      }
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }

    .bg-orb--1 {
      width: min(55vw, 420px);
      height: min(55vw, 420px);
      top: -8%;
      right: -10%;
      background: rgba(94, 176, 255, 0.35);
      animation: float1 14s ease-in-out infinite;
    }

    .bg-orb--2 {
      width: min(45vw, 340px);
      height: min(45vw, 340px);
      bottom: -5%;
      left: -8%;
      background: rgba(100, 140, 255, 0.22);
      animation: float2 16s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(-24px, 18px) scale(1.06);
      }
    }

    @keyframes float2 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(20px, -14px) scale(1.04);
      }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 32rem;
      animation: cardEnter 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: clamp(1.75rem, 5vw, 2.5rem) clamp(1.5rem, 4vw, 2.25rem);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), rgba(130, 110, 255, 0.8), transparent);
      opacity: 0.85;
      animation: shimmerLine 4s ease-in-out infinite;
    }

    @keyframes shimmerLine {
      0%, 100% {
        opacity: 0.5;
        transform: scaleX(0.92);
      }
      50% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    .card-header {
      margin-bottom: clamp(1.5rem, 4vw, 2rem);
      padding-bottom: clamp(1.25rem, 3vw, 1.5rem);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.65rem;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    h1 {
      font-family: "Outfit", "DM Sans", sans-serif;
      font-size: clamp(1.55rem, 4.5vw, 1.95rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      background: linear-gradient(120deg, #ffffff 0%, #c8dff5 45%, #9ec8f0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    ol {
      list-style: none;
      counter-reset: item;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    li {
      counter-increment: item;
      position: relative;
      padding: 1rem 1rem 1rem 3.35rem;
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      opacity: 0;
      transform: translateX(-8px);
      animation: rowIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition:
        background 0.28s ease,
        border-color 0.28s ease,
        transform 0.28s ease,
        box-shadow 0.28s ease;
    }

    li:nth-child(1) {
      animation-delay: 0.42s;
    }

    li:nth-child(2) {
      animation-delay: 0.52s;
    }

    li:nth-child(3) {
      animation-delay: 0.62s;
    }

    li:nth-child(4) {
      animation-delay: 0.72s;
    }

    li:nth-child(5) {
      animation-delay: 0.82s;
    }

    @keyframes rowIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    li::before {
      content: counter(item);
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Outfit", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-dim);
      border-radius: 0.5rem;
      border: 1px solid rgba(94, 176, 255, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    li:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.07);
      transform: translateX(4px);
      box-shadow: 0 8px 24px -12px rgba(0, 0, 0, 0.35);
    }

    li:hover::before {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-layer,
      .bg-orb--1,
      .bg-orb--2,
      .card::before {
        animation: none;
      }

      main,
      .eyebrow,
      h1,
      li {
        animation: none !important;
        opacity: 1;
        transform: none;
      }

      li {
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      li:hover {
        transform: none;
      }

      li:hover::before {
        transform: translateY(-50%);
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--2" aria-hidden="true"></div>

  <main>
    <article class="card">
      <header class="card-header">
        <p class="eyebrow">Набор ролей</p>
        <h1>GPT — агенты для экспертов</h1>
      </header>
      <ol>
        <li>Распаковщик личности</li>
        <li>Анализ целевой аудитории</li>
        <li>Исследование конкурентов</li>
        <li>Воронка продаж</li>
        <li>Маркетолог</li>
      </ol>
    </article>
  </main>
</body>
</html>
