<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT — агенты для экспертов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222d;
      --text: #e8eef4;
      --muted: #8b9cb0;
      --accent: #3d9cf5;
      --accent-soft: rgba(61, 156, 245, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.5;
    }

    .card {
      max-width: 36rem;
      width: 100%;
      background: linear-gradient(145deg, var(--surface) 0%, #151c26 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1.25rem;
      padding: 2.5rem 2.25rem;
      box-shadow:
        0 0 0 1px rgba(61, 156, 245, 0.08),
        0 24px 48px -12px rgba(0, 0, 0, 0.45);
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
      line-height: 1.25;
      background: linear-gradient(135deg, #fff 0%, #b8d4f0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    ol {
      list-style: none;
      counter-reset: item;
    }

    li {
      counter-increment: item;
      position: relative;
      padding: 0.85rem 0 0.85rem 3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 1.05rem;
      font-weight: 500;
    }

    li:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    li::before {
      content: counter(item);
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>GPT — агенты для экспертов</h1>
    <ol>
      <li>Распаковщик личности</li>
      <li>Анализ целевой аудитории</li>
      <li>Исследование конкурентов</li>
      <li>Воронка продаж</li>
      <li>Маркетолог</li>
    </ol>
  </main>
</body>
</html>
